name: CI

# One full gate per tree. A pull request runs it on its head; a merge-queue draft runs it on the merged tree. A push
# to main runs it once for the commit that landed. A newer push to a pull request cancels its older run. Commit
# linting of the squashed message lives in `squash-message.yml`, so a title or body edit never re-runs this gate.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'mergify/merge-queue/') }}

jobs:
  static-checks:
    name: static checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: pnpm-store
        uses: ./.github/actions/pnpm-store
      - run: pnpm install --frozen-lockfile
      # Only a push to main writes the pnpm store; every other run restores it read-only.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.pnpm-store.outputs.hit != 'true'
        uses: ./.github/actions/pnpm-store
        with:
          mode: save
          key: ${{ steps.pnpm-store.outputs.key }}
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # attw and the export checks guard the built output, so the build precedes them.
      - run: pnpm build
      - run: pnpm check:exports
      - run: pnpm check:record-format
      - run: pnpm check:package-purity
      - run: pnpm check:pack

  changeset:
    name: change intent
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    uses: systemfsoftware/pnpm-release-management/.github/workflows/changeset-check.yml@1e897828d917341fb7dd444c7bbd6cfa0998caa9
    permissions:
      contents: read
      pull-requests: read

  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: ./.github/actions/pnpm-store
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # Transaction rollback and connection cleanup cannot be proven against an in-process double, so the Postgres
  # storage suite runs against real servers on each supported major.
  storage-postgres:
    name: test (postgres ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "17", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: effect_agent
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: ./.github/actions/pnpm-store
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @systemfsoftware/agent-storage-postgres test
        env:
          EFFECT_AGENT_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:55432/effect_agent

  # The one check the ruleset requires and the merge queue gates on; the name matches the shared CI of the other
  # systemfsoftware repositories. List every other job in `needs`: a job left out is not gated. The job always runs,
  # and any dependency that did not conclude `success` fails it, so a run that did not execute the gate can never
  # stand in for one that passed. The change-intent job is skipped on a push and on the release pull request.
  check:
    name: checks / check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [static-checks, changeset, test, storage-postgres]
    if: ${{ always() }}
    steps:
      - name: Require every job to succeed
        env:
          STATIC_CHECKS: ${{ needs.static-checks.result }}
          TEST: ${{ needs.test.result }}
          STORAGE_POSTGRES: ${{ needs.storage-postgres.result }}
          CHANGESET: ${{ needs.changeset.result }}
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          status=0
          for pair in "static-checks:$STATIC_CHECKS" "test:$TEST" "storage-postgres:$STORAGE_POSTGRES"; do
            case "$pair" in
              *:success) ;;
              *) echo "A required job finished as: $pair"; status=1 ;;
            esac
          done
          if [ "$CHANGESET" != success ]; then
            if [ "$CHANGESET" = skipped ] && { [ "$EVENT" != pull_request ] || [ "$HEAD_REF" = changeset-release/main ]; }; then
              :
            else
              echo "A required job finished as: changeset:$CHANGESET"
              status=1
            fi
          fi
          exit "$status"
