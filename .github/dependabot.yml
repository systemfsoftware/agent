# Dependabot keeps Actions and npm dependencies current. Security advisories arrive through
# Dependabot alerts on the dependency graph.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    ignore:
      # @effect/tsgo 0.70.0 refuses @oxlint-tsgolint 7.0.2008 during `prepare`, so the bump cannot install.
      # Remove this once @effect/tsgo accepts it.
      - dependency-name: "oxlint-tsgolint"
    groups:
      effect:
        patterns: ["effect", "@effect/*"]
      dependencies:
        patterns: ["*"]
        exclude-patterns: ["effect", "@effect/*"]
