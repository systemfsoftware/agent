# Dependabot keeps Actions and npm dependencies current. Security advisories arrive through
# Dependabot alerts on the dependency graph.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      effect:
        patterns: ["effect", "@effect/*"]
      dependencies:
        patterns: ["*"]
        exclude-patterns: ["effect", "@effect/*"]
